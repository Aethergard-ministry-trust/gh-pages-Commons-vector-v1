# Sandbox preview server for the static CVP site.
# Serves the repository checkout directly, so edits appear without a rebuild.
#
# Workers run as root because the sandbox checkout is a 0700 root-owned directory
# (the default unprivileged `nginx` user cannot traverse it). This file is only
# used by docker-compose.base44.yml for local preview.
user root;
worker_processes auto;
error_log /var/log/nginx/error.log notice;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    keepalive_timeout 65;
    server_tokens off;
    charset utf-8;

    access_log /var/log/nginx/access.log;

    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # Development server: always revalidate, so a reload shows the current file.
        add_header Cache-Control "no-store" always;

        # Keep repository internals (.git, .base44, dotfiles) off the web.
        location ~ /\. {
            deny all;
        }

        # The bundled mime.types has no markdown entry; render .md as readable text
        # (like the GitHub Pages deployment does) instead of downloading it.
        location ~* \.md$ {
            types { }
            default_type text/markdown;
            try_files $uri =404;
        }

        location / {
            try_files $uri $uri/ =404;
            autoindex off;
        }
    }
}
