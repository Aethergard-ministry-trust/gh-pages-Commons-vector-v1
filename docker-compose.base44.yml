name: commons-vector-v1-base44

services:
  generator:
    image: python:3.12-slim
    restart: on-failure
    working_dir: /app/neuralcommons-app-generator
    ports:
      - "3000:8000"
    volumes:
      - ./:/app
    environment:
      - BASE44_PREVIEW_MODE
      - OLLAMA_URL=http://127.0.0.1:11434
      - ARCHIVE_URL=https://3001-${BASE44_PUBLIC_HOST_SUFFIX}
    # Rebuild the application from prompts on boot, then serve the console with live reload.
    command:
      - sh
      - -ec
      - |
        pip install --no-cache-dir -r requirements.txt
        python scripts/generate_app.py
        exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload \
          --reload-dir app --reload-dir scripts --reload-dir templates --reload-dir prompts
    labels:
      base44.project: "NeuralCommons App Generator"
      base44.kind: web
      base44.port: "3000"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -c "import urllib.request,sys;
          sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).status == 200 else 1)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 90s

  archive:
    image: nginx:alpine
    restart: on-failure
    ports:
      - "3001:80"
    volumes:
      - ./:/usr/share/nginx/html:ro
      - ./.base44/nginx.conf:/etc/nginx/nginx.conf:ro
    environment:
      - BASE44_PREVIEW_MODE
    labels:
      base44.project: "Det Levende Arkivet"
      base44.kind: web
      base44.port: "3001"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
