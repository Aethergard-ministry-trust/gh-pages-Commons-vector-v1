name: {{PROJECT_SLUG}}

services:
  api:
    image: python:3.12-slim
    working_dir: /app/backend
    restart: on-failure
    volumes:
      - ./backend:/app/backend
    ports:
      - "8000:8000"
    environment:
      - CVP_NAMESPACE={{NAMESPACE}}
      - CVP_MODEL={{MODEL}}
      - CVP_OLLAMA_URL={{OLLAMA_URL}}
      - CVP_FRONTEND_ORIGIN=http://localhost:3000
    command:
      ["sh", "-ec", "pip install --no-cache-dir -r requirements.txt && exec uvicorn main:app --host 0.0.0.0 --port 8000 --reload"]

  frontend:
    image: node:22-slim
    working_dir: /app/frontend
    restart: on-failure
    volumes:
      - ./frontend:/app/frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_CVP_API_URL=http://localhost:8000
    command:
      ["sh", "-ec", "npm install --no-audit --no-fund && exec npm run dev -- --hostname 0.0.0.0 --port 3000"]
    depends_on:
      - api
